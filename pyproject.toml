[build-system]
  requires = ["flit_core >=3.2,<4"]
  build-backend = "flit_core.buildapi"

[project]
  name = "simple-py-monads"
  authors = [{name = "Dylan Baker", email = "dylan@pnwbakers.com"}]
  dynamic = ["version", "description"]
  requires-python = ">=3.10"
  classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
  ]
  keywords = [
    "Monad",
    "Optional",
    "Result",
  ]

[project.optional-dependencies]
  test = [
    "pytest",
    "pytest-asyncio",
  ]

  lint = [
    "mypy",
    "ruff"
  ]

[project.urls]
  Source = "https://github.com/dcbaker/simple-monads"

[tool.flit.module]
  name = "simple_monads"

[tool.mypy]
  python_version = "3.10"
  strict = true
  packages = ["simple_monads", "tests"]

[tool.pytest.ini_options]
  addopts = ["--doctest-modules"]

[tool.ruff]
  line-length = 100

  [tool.ruff.lint]
    select = ["ASYNC", "A", "B", "E", "F", "I", "N", "PERF", "SIM", "UP"]

[tool.bumpversion]
  current_version = "0.0.6"
  parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
  serialize = ["{major}.{minor}.{patch}"]
  search = "{current_version}"
  replace = "{new_version}"
  regex = false
  ignore_missing_version = false
  ignore_missing_files = false
  tag = true
  push_tag = false
  sign_tags = true
  tag_name = "{new_version}"
  tag_message = "Bump version: {current_version} → {new_version}"
  allow_dirty = false
  commit = true
  message = "Bump version: {current_version} → {new_version}"
  moveable_tags = []
  commit_args = "-S"
  setup_hooks = []
  pre_commit_hooks = []
  post_commit_hooks = []
  allow_shell_hooks = false

  [[tool.bumpversion.files]]
    filename = "simple_monads/__init__.py"
